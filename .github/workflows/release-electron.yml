name: Release Electron App

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: read

jobs:
  update-package-version:
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ steps.commit-version.outputs.commit-sha }}

    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Derive package version from release tag
        id: release-version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must be a semantic version, optionally prefixed with v (for example, v1.14.0-alpha.1)."
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Validate release target branch
        id: release-target
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail

          if ! git check-ref-format --branch "$RELEASE_TARGET" >/dev/null; then
            echo "::error::Release target '$RELEASE_TARGET' is not a valid branch name."
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/${RELEASE_TARGET}:refs/remotes/origin/${RELEASE_TARGET}"
          release_sha="$(git rev-parse HEAD)"
          target_sha="$(git rev-parse "refs/remotes/origin/${RELEASE_TARGET}")"

          if [ "$release_sha" = "$target_sha" ]; then
            echo "existing-commit-sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target_parent_sha="$(git rev-parse "${target_sha}^")"
          expected_subject="chore: Updated package version to $PACKAGE_VERSION"
          actual_subject="$(git log -1 --format=%s "$target_sha")"
          expected_paths="$(printf '%s\n' backend/package.json electron/package.json frontend/package.json package.json | sort)"
          actual_paths="$(git diff-tree --no-commit-id --name-only -r "$target_sha" | sort)"

          if [ "$target_parent_sha" != "$release_sha" ] || [ "$actual_subject" != "$expected_subject" ]; then
            echo "::error::Release target '$RELEASE_TARGET' moved to an unrelated commit after the release tag was created."
            exit 1
          fi

          if [ -n "$actual_paths" ] && [ "$actual_paths" != "$expected_paths" ]; then
            echo "::error::Existing package version commit changed unexpected files."
            exit 1
          fi

          git checkout --detach "$target_sha"
          node scripts/update-package-version.mjs --version "$PACKAGE_VERSION"

          if ! git diff --quiet -- package.json electron/package.json frontend/package.json backend/package.json; then
            echo "::error::Existing package version commit does not contain version $PACKAGE_VERSION in all package manifests."
            exit 1
          fi

          echo "Reusing existing package version commit $target_sha."
          echo "existing-commit-sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Update and commit package versions
        id: commit-version
        shell: bash
        env:
          EXISTING_COMMIT_SHA: ${{ steps.release-target.outputs.existing-commit-sha }}
          PACKAGE_VERSION: ${{ steps.release-version.outputs.version }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail

          if [ -n "$EXISTING_COMMIT_SHA" ]; then
            echo "commit-sha=$EXISTING_COMMIT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/update-package-version.mjs --version "$PACKAGE_VERSION"
          git add package.json electron/package.json frontend/package.json backend/package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: Updated package version to $PACKAGE_VERSION"
          git push origin "HEAD:refs/heads/${RELEASE_TARGET}"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows-app-directory:
    needs: update-package-version
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NOTESTACK_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.NOTESTACK_GOOGLE_OAUTH_CLIENT_ID }}
      NOTESTACK_MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.NOTESTACK_MICROSOFT_OAUTH_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Validate OAuth build configuration
        env:
          NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET }}
        shell: pwsh
        run: |
          $requiredConfiguration = @(
            "NOTESTACK_GOOGLE_OAUTH_CLIENT_ID",
            "NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET",
            "NOTESTACK_MICROSOFT_OAUTH_CLIENT_ID"
          )

          foreach ($variableName in $requiredConfiguration) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($variableName))) {
              throw "$variableName build credential is missing."
            }
          }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Electron app directory
        env:
          NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run package:dir

      - name: Upload unsigned app directory
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-app-directory
          path: electron/release/win-unpacked/**
          if-no-files-found: error

  sign-windows-app-directory:
    needs:
      - update-package-version
      - build-windows-app-directory
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reactiveui/certum-signer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Download unsigned app directory
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-app-directory
          path: electron/release/win-unpacked

      - name: Validate Certum signing environment
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTUM_USER_ID:?Set the CERTUM_USER_ID repository secret to the SimplySign login id.}"
          : "${CERTUM_OTP_URI:?Set the CERTUM_OTP_URI repository secret to the otpauth:// TOTP URI.}"
          : "${CERTUM_CERT_FINGERPRINT:?Set CERTUM_CERT_FINGERPRINT to the SHA-256 fingerprint of the Certum code-signing certificate.}"
          : "${SS_DIST:?The Certum signer image must expose SS_DIST.}"
          : "${JSIGN_JAR:?The Certum signer image must expose JSIGN_JAR.}"

      - name: Sign inner app executables with Certum SimplySign
        uses: ./.github/actions/certum-sign
        with:
          artifacts-glob: electron/release/win-unpacked/**/*.exe

      - name: Upload signed app directory
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-app-directory
          path: electron/release/win-unpacked/**
          if-no-files-found: error

  build-windows-installer:
    needs:
      - update-package-version
      - sign-windows-app-directory
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download signed app directory
        uses: actions/download-artifact@v4
        with:
          name: signed-windows-app-directory
          path: electron/release/win-unpacked

      - name: Build unsigned installer from signed app directory
        run: npm run package:prepackaged --workspace electron

      - name: Verify unsigned updater release artifacts
        run: npm run verify:release-artifacts --workspace electron

      - name: Upload unsigned installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: |
            electron/release/latest.yml
            electron/release/*.exe
            electron/release/*.exe.blockmap
          if-no-files-found: error

  sign-windows-installer:
    needs:
      - update-package-version
      - build-windows-installer
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reactiveui/certum-signer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Download unsigned installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-installer
          path: electron/release

      - name: Validate Certum signing environment
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTUM_USER_ID:?Set the CERTUM_USER_ID repository secret to the SimplySign login id.}"
          : "${CERTUM_OTP_URI:?Set the CERTUM_OTP_URI repository secret to the otpauth:// TOTP URI.}"
          : "${CERTUM_CERT_FINGERPRINT:?Set CERTUM_CERT_FINGERPRINT to the SHA-256 fingerprint of the Certum code-signing certificate.}"
          : "${SS_DIST:?The Certum signer image must expose SS_DIST.}"
          : "${JSIGN_JAR:?The Certum signer image must expose JSIGN_JAR.}"

      - name: Sign installer with Certum SimplySign
        uses: ./.github/actions/certum-sign
        with:
          artifacts-glob: electron/release/*.exe

      - name: Upload signed installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-installer
          path: |
            electron/release/latest.yml
            electron/release/*.exe
            electron/release/*.exe.blockmap
          if-no-files-found: error

  prepare-windows-release-artifacts:
    needs:
      - update-package-version
      - sign-windows-installer
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for release metadata refresh
        run: npm ci --ignore-scripts

      - name: Download signed installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-windows-installer
          path: electron/release

      - name: Refresh updater metadata after signing
        run: npm run refresh:signed-release-artifacts --workspace electron

      - name: Verify signed Windows updater release artifacts
        run: npm run verify:release-artifacts:windows --workspace electron

      - name: Upload validated Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-windows-release-${{ needs.update-package-version.outputs.commit-sha }}
          path: |
            electron/release/latest.yml
            electron/release/*.exe
            electron/release/*.exe.blockmap
          if-no-files-found: error

  build-macos-release:
    needs: update-package-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      NOTESTACK_PACKAGE_ARCH: ${{ matrix.arch }}
      NOTESTACK_PACKAGED_PLATFORM: darwin
      NOTESTACK_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.NOTESTACK_GOOGLE_OAUTH_CLIENT_ID }}
      NOTESTACK_MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.NOTESTACK_MICROSOFT_OAUTH_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Validate macOS release secrets
        shell: bash
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER_SECRET:?Set the APPLE_API_ISSUER repository secret.}"
          : "${APPLE_API_KEY_BASE64:?Set the APPLE_API_KEY_BASE64 repository secret.}"
          : "${APPLE_API_KEY_ID_SECRET:?Set the APPLE_API_KEY_ID repository secret.}"
          : "${MACOS_CERTIFICATE_BASE64:?Set the MACOS_CERTIFICATE_BASE64 repository secret.}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set the MACOS_CERTIFICATE_PASSWORD repository secret.}"
          : "${NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET:?Set the NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET repository secret.}"

      - name: Materialize scoped Apple credentials
        shell: bash
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/notestack-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          {
            echo "CSC_LINK=$certificate_path"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apple signing and notarization environment
        run: npm run verify:mac-release-environment --workspace electron

      - name: Build application workspaces
        env:
          NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run build

      - name: Build, sign, and notarize macOS app, DMG, and ZIP
        shell: bash
        env:
          NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.NOTESTACK_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run "package:mac:${NOTESTACK_PACKAGE_ARCH}" --workspace electron

      - name: Notarize and staple macOS DMG
        run: npm run notarize:macos-dmg --workspace electron

      - name: Locate packaged application
        id: packaged-app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find electron/release -type d -name NoteStack.app -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::The packaged NoteStack.app bundle was not found."
            exit 1
          fi
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Verify packaged backend and native dependency closure
        env:
          NOTESTACK_UNPACKED_ROOT: ${{ steps.packaged-app.outputs.path }}
        run: npm run verify:packaged-backend --workspace electron

      - name: Verify concurrent packaged OAuth flow
        env:
          NOTESTACK_UNPACKED_ROOT: ${{ steps.packaged-app.outputs.path }}
        run: npm run verify:packaged-oauth --workspace electron

      - name: Verify signatures, Gatekeeper, stapling, and Mach-O architecture
        env:
          NOTESTACK_UNPACKED_ROOT: ${{ steps.packaged-app.outputs.path }}
        run: npm run verify:macos-package --workspace electron

      - name: Verify DMG copy-install and ZIP payload
        shell: bash
        env:
          NOTESTACK_UNPACKED_ROOT: ${{ steps.packaged-app.outputs.path }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./electron/package.json').version")"
          dmg_path="electron/release/notestack-${version}-${NOTESTACK_PACKAGE_ARCH}.dmg"
          zip_path="electron/release/notestack-${version}-${NOTESTACK_PACKAGE_ARCH}.zip"
          mount_path="$RUNNER_TEMP/notestack-dmg-${NOTESTACK_PACKAGE_ARCH}"
          install_path="$RUNNER_TEMP/notestack-install-${NOTESTACK_PACKAGE_ARCH}"
          mkdir -p "$mount_path" "$install_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path" >/dev/null 2>&1 || true' EXIT
          ditto "$mount_path/NoteStack.app" "$install_path/NoteStack.app"
          codesign --verify --deep --strict "$install_path/NoteStack.app"
          NOTESTACK_UNPACKED_ROOT="$install_path/NoteStack.app" npm run verify:packaged-oauth --workspace electron
          unzip -l "$zip_path" | grep -Fq 'NoteStack.app/Contents/MacOS/NoteStack'
          hdiutil detach "$mount_path"
          trap - EXIT

      - name: Preserve architecture-specific updater manifest
        shell: bash
        run: mv electron/release/latest-mac.yml "electron/release/latest-mac-${NOTESTACK_PACKAGE_ARCH}.yml"

      - name: Upload validated macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-macos-${{ matrix.arch }}-${{ needs.update-package-version.outputs.commit-sha }}
          path: |
            electron/release/latest-mac-${{ matrix.arch }}.yml
            electron/release/notestack-*-${{ matrix.arch }}.dmg
            electron/release/notestack-*-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-electron-release:
    needs:
      - update-package-version
      - prepare-windows-release-artifacts
      - build-macos-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-package-version.outputs.commit-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release validation dependencies
        run: npm ci --ignore-scripts

      - name: Download validated Windows assets
        uses: actions/download-artifact@v4
        with:
          name: validated-windows-release-${{ needs.update-package-version.outputs.commit-sha }}
          path: electron/release

      - name: Download validated Intel macOS assets
        uses: actions/download-artifact@v4
        with:
          name: validated-macos-x64-${{ needs.update-package-version.outputs.commit-sha }}
          path: electron/release

      - name: Download validated Apple Silicon macOS assets
        uses: actions/download-artifact@v4
        with:
          name: validated-macos-arm64-${{ needs.update-package-version.outputs.commit-sha }}
          path: electron/release

      - name: Merge architecture-specific macOS updater manifests
        run: >-
          npm run merge:mac-update-manifests --workspace electron --
          electron/release/latest-mac-x64.yml
          electron/release/latest-mac-arm64.yml
          electron/release/latest-mac.yml

      - name: Verify complete cross-platform release set
        run: |
          npm run verify:release-artifacts:windows --workspace electron
          npm run verify:release-artifacts:mac --workspace electron

      - name: Publish exact release assets with rollback on failure
        run: >-
          node electron/scripts/publish-release-assets.mjs
          "${{ github.event.release.tag_name }}"
          "${{ github.repository }}"
          electron/release
